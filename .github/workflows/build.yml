name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # Startet den Build, sobald du etwas im main-Branch speicherst

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    
    # Hier die Schreibrechte für Packages aktivieren:
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/gitanito/docling-runpod:latest
